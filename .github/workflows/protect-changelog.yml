name: Protect CHANGELOG

on:
  pull_request:
    paths:
      - "CHANGELOG.md"

jobs:
  block-manual-changelog:
    name: Block manual CHANGELOG edits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Documented, scoped exception: the release workflow (release.yml) opens
      # an automated PR from branch changelog-update/<tag> via
      # github-actions[bot] to update CHANGELOG.md instead of pushing to main
      # directly. That PR is intentionally allowed through here; every other
      # PR touching CHANGELOG.md is still blocked.
      - name: Fail if CHANGELOG.md was manually edited
        if: |
          !(github.actor == 'github-actions[bot]' &&
            startsWith(github.head_ref, 'changelog-update/'))
        run: |
          echo "❌ CHANGELOG.md must not be edited manually."
          echo "It is auto-generated by git-cliff on release."
          echo "Remove the CHANGELOG.md change from this PR."
          exit 1

      # Guard against changelog links drifting to a defunct GitHub org after a
      # repo transfer. The canonical remote is solutions-plug/predictIQ; any
      # other org (e.g. the legacy popsman01) must never appear in generated
      # compare/commit/issue links. See cliff.toml for the git-cliff remote
      # configuration that produces these links.
      - name: Fail if CHANGELOG.md links point to a non-canonical org
        if: |
          !(github.actor == 'github-actions[bot]' &&
            startsWith(github.head_ref, 'changelog-update/'))
        run: |
          if grep -nE 'github\.com/(popsman01)/predictIQ' CHANGELOG.md; then
            echo "❌ CHANGELOG.md contains links to a defunct GitHub org."
            echo "Expected org: solutions-plug (see cliff.toml remote config)."
            echo "Regenerate the changelog with git-cliff so links use the canonical remote."
            exit 1
          fi
          echo "✅ CHANGELOG.md links use the canonical org."
